<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="description" content="Walk through the house in 3D: both floors, every room.">
<title>House 6 × 20 m — 3D Walkthrough</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: full-bleed live 3D view; drafting-style title block top-left, plan key on the right edge, room shortcuts along the bottom */
:root{
  --bg:#a9c4e0; --panel:rgba(248,247,243,.93); --ink:#22272b; --muted:#5b656d; --line:#c6cac7;
  --accent:#a84f2a; --wallfill:#3b4146; --furn:#b9bfc2; --font:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --panel:rgba(26,31,35,.93); --ink:#e9ecee; --muted:#a3adb4; --line:#3e474e; --accent:#e58a5c; --wallfill:#dfe4e7; --furn:#5c666d; color-scheme:dark } }
:root[data-theme="dark"]{
  --panel:rgba(26,31,35,.93); --ink:#e9ecee; --muted:#a3adb4; --line:#3e474e; --accent:#e58a5c; --wallfill:#dfe4e7; --furn:#5c666d; color-scheme:dark }
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;font-size:14px;background:var(--bg);color:var(--ink);font-family:var(--font);overflow:hidden;position:relative}
#view{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#view:active{cursor:grabbing}
.panel{position:absolute;background:var(--panel);border:1px solid var(--line);border-radius:4px;backdrop-filter:blur(6px)}
#title{left:16px;top:16px;padding:10px 14px;max-width:calc(100% - 140px)}
#title h1{margin:0;font-size:14px;font-weight:500;letter-spacing:.03em;color:var(--muted)}
#where{margin-top:1px;font-size:20px;font-weight:600;line-height:1.15}
#lvl{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-top:3px}
#key{right:16px;top:16px;padding:8px;display:flex;flex-direction:column;gap:4px;align-items:center}
#key span{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
#map{width:84px;height:280px;display:block}
#jump{left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));padding:6px;display:flex;flex-direction:column;gap:6px}
#jump .row{display:flex;gap:6px;overflow-x:auto;scrollbar-width:thin}
#jump button{flex:none;font:500 13px var(--font);color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:3px;padding:8px 12px;cursor:pointer;white-space:nowrap}
#jump button:hover{border-color:var(--ink)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#hint{font-size:12px;color:var(--muted);padding:0 4px}
#load{inset:0;border:0;border-radius:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;backdrop-filter:none;background:var(--panel)}
#load b{font-size:18px;font-weight:600}
#load p{margin:0;font-size:13px;color:var(--muted);max-width:32ch;text-align:center}
#bar{width:min(320px,70%);height:6px;background:var(--line);border-radius:3px;overflow:hidden}
#bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
#stick{position:absolute;left:22px;bottom:calc(118px + env(safe-area-inset-bottom,0px));width:112px;height:112px;border:2px solid var(--panel);border-radius:50%;background:rgba(20,24,27,.28);touch-action:none;cursor:pointer}
#stick::after{content:"WALK";position:absolute;left:0;right:0;top:-20px;text-align:center;font:600 10px var(--font);letter-spacing:.14em;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.7)}
#run{position:absolute;right:22px;bottom:calc(132px + env(safe-area-inset-bottom,0px));width:64px;height:64px;border-radius:50%;border:2px solid var(--panel);background:rgba(20,24,27,.28);color:#fff;font:600 11px var(--font);letter-spacing:.08em;cursor:pointer}
#run[aria-pressed="true"]{background:var(--accent)}
#intro{left:50%;top:50%;transform:translate(-50%,-50%);padding:18px 20px;width:min(340px,calc(100% - 48px));display:flex;flex-direction:column;gap:10px}
#intro b{font-size:17px}
#intro ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:14px}
#intro button{font:600 14px var(--font);padding:10px;border-radius:3px;border:0;background:var(--ink);color:var(--panel);cursor:pointer}
#stick i{position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px;border-radius:50%;background:var(--panel);pointer-events:none}
@media (max-width:560px){ #map{width:56px;height:187px} #where{font-size:17px} }
</style>

</head>
<body>
<canvas id="view"></canvas>
<div class="panel" id="title">
  <h1>House 6 × 20 m</h1>
  <div id="where">Street</div>
  <div id="lvl">Level 1</div>
</div>
<div class="panel" id="key"><span id="keyLbl">Level 1</span><canvas id="map" width="168" height="560" aria-label="Floor plan showing where you are"></canvas></div>
<div class="panel" id="jump">
  <div class="row" role="navigation" aria-label="Jump to a room">
    <button data-j="street">Street</button><button data-j="entrance">Entrance</button><button data-j="living">Living room</button>
    <button data-j="kitchen">Kitchen</button><button data-j="bed1">Bedroom</button><button data-j="bath1">Bathroom</button>
    <button data-j="upper">Upstairs</button><button data-j="bed2">Upper bedroom</button><button data-j="reception">Reception</button>
  </div>
  <div id="hint"></div>
</div>
<div id="stick" aria-label="Walk joystick"><i></i></div>
<button id="run" aria-pressed="false">FAST</button>
<div class="panel" id="intro" hidden><b>How to move</b><ul id="introList"></ul><button id="introOk">Start the tour</button></div>
<div class="panel" id="load"><b>Opening the house</b><div id="bar"><i></i></div><p id="loadmsg">Loading rooms and lighting…</p></div>

<script src="three.min.js"></script>
<script src="GLTFLoader.js"></script>
<script>
(function(){
const $=id=>document.getElementById(id);
function fail(t){ $('load').hidden=false; $('loadmsg').textContent=t; $('bar').hidden=true; }
if(!window.THREE||!THREE.GLTFLoader){ fail('3D graphics could not start in this browser.'); return; }
const canvas=$('view'); let renderer;
const LITE=matchMedia('(pointer:coarse)').matches||Math.min(screen.width,screen.height)<700;
try{ renderer=new THREE.WebGLRenderer({canvas,antialias:!LITE,powerPreference:'high-performance'}); }catch(e){ fail('3D graphics could not start in this browser.'); return; }
renderer.setPixelRatio(Math.min(devicePixelRatio||1,LITE?1.5:2)); renderer.outputEncoding=THREE.sRGBEncoding;
const scene=new THREE.Scene(); scene.background=new THREE.Color(0xa9c4e0);
const cam=new THREE.PerspectiveCamera(72,1,0.05,300);
const FH=3.2, F2=FH+0.02, R=FH/18, PR=0.2, EYE=1.58;

// ---------- materials: baked textures are shown as they are; a few surfaces get simple live materials ----------
let env=null;
const flatCol={'Globe light':0xfff0da,'LED warm':0xffe0b4,'Downlight':0xfff4e0,'Black metal':0x151618,'Brass':0xb08a4e,'Brushed steel':0x8e9093};
function baseName(n){ return (n||'').replace(/\.\d{3}$/,''); }
const mcache=new Map();
function conv(m){ if(mcache.has(m.uuid)) return mcache.get(m.uuid); const n=baseName(m.name); let r;
  if(m.map) r=new THREE.MeshBasicMaterial({map:m.map,side:THREE.DoubleSide});
  else if(n==='Glass') r=new THREE.MeshBasicMaterial({color:0xe6f1ec,transparent:true,opacity:.13,depthWrite:false,side:THREE.DoubleSide});
  else if(n==='Mirror') r=new THREE.MeshBasicMaterial({color:0xf2f2f2,envMap:env,reflectivity:1});
  else if(n==='TV screen') r=new THREE.MeshBasicMaterial({color:0x08090a,envMap:env,combine:THREE.MixOperation,reflectivity:.12});
  else if(n==='Brushed steel'||n==='Brass') r=new THREE.MeshBasicMaterial({color:flatCol[n],envMap:env,combine:THREE.MixOperation,reflectivity:.35});
  else r=new THREE.MeshBasicMaterial({color:flatCol[n]!==undefined?flatCol[n]:(m.color?m.color.getHex():0x888888),side:THREE.DoubleSide});
  if(m.map){ if(LITE){ m.map.generateMipmaps=false; m.map.minFilter=THREE.LinearFilter; } else m.map.anisotropy=Math.min(8,renderer.capabilities.getMaxAnisotropy()); }
  mcache.set(m.uuid,r); return r; }

// ---------- collision data ----------
let cols=[]; const surfs=[];
surfs.push({x0:3.3,x1:4.95,y0:9.35,y1:10.4,h:x=>(x-3.3)/1.65*7*R});
surfs.push({x0:4.95,x1:5.8,y0:9.35,y1:11.65,h:(x,y)=>7*R+(Math.atan2(y-10.5,x-4.95)+Math.PI/2)/Math.PI*4*R});
surfs.push({x0:3.3,x1:4.95,y0:10.6,y1:11.65,h:x=>11*R+(4.95-x)/1.65*7*R});
surfs.push({x0:1.35,x1:2.33,y0:4.5,y1:5.45,h:(x,y)=>(Math.PI/2-Math.atan2(y-4.5,x-1.35))/(Math.PI/2)*4*R});
surfs.push({x0:1.35,x1:2.33,y0:2.25,y1:4.5,h:(x,y)=>4*R+(4.5-y)/2.25*14*R});
const EXTRA=[[.84,1.62,9.82,11.18,0,.76],[.2,.52,12.5,13.9,FH,FH+.82],[.25,2.25,19.2,19.78,FH,FH+.76],[4.86,4.91,13.55,14.75,0,2.1],[4.86,4.91,13.55,14.75,FH,FH+2.1],
  [3.3,3.36,10.6,11.65,0,2.8]];
function addCols(d){ const mk=(a,f)=>({x0:a[0],x1:a[1],y0:a[2],y1:a[3],z0:a[4],z1:a[5],f});
  d.walls.forEach(a=>cols.push(mk(a,0))); d.furn.forEach(a=>cols.push(mk(a,1))); EXTRA.forEach(a=>cols.push(mk(a,1)));
  d.slabs.forEach(s=>surfs.push({x0:s[0],x1:s[1],y0:s[2],y1:s[3],h:()=>F2})); }

// ---------- player ----------
const p={x:3.6,y:-6.2,f:0,yaw:0,pitch:.07};
function floorAt(x,y,f){ let b=0; for(const s of surfs){ if(x>=s.x0&&x<=s.x1&&y>=s.y0&&y<=s.y1){ const h=s.h(x,y); if(h<=f+.55&&h>b) b=h; } } return b; }
function blocked(x,y,f){ for(const s of surfs){ if(x>=s.x0&&x<=s.x1&&y>=s.y0&&y<=s.y1){ const h=s.h(x,y); if(h>f+.55&&h<f+2.0) return true; } } return false; }
function collide(x,y,f){
  for(let it=0;it<3;it++) for(const c of cols){
    if(c.z0>=f+1.7||c.z1<=f+.3) continue;
    const nx=Math.max(c.x0,Math.min(x,c.x1)), ny=Math.max(c.y0,Math.min(y,c.y1)), dx=x-nx, dy=y-ny, d2=dx*dx+dy*dy;
    if(d2>=PR*PR) continue;
    if(d2>1e-9){ const d=Math.sqrt(d2); x=nx+dx/d*PR; y=ny+dy/d*PR; }
    else{ const l=x-c.x0,r=c.x1-x,b=y-c.y0,t=c.y1-y,m=Math.min(l,r,b,t);
      if(m==l)x=c.x0-PR; else if(m==r)x=c.x1+PR; else if(m==b)y=c.y0-PR; else y=c.y1+PR; }
  }
  return [x,y];
}
const keys={}; let joy={x:0,y:0};
addEventListener('keydown',e=>{ keys[e.code]=1; if(e.code.startsWith('Arrow')||e.code=='Space') e.preventDefault(); });
addEventListener('keyup',e=>{ keys[e.code]=0; });
addEventListener('blur',()=>{ for(const k in keys) keys[k]=0; });
const ptr=new Map(); let joyId=null, target=null, stuck=0, fast=false;
const stick=$('stick'), knob=stick.firstElementChild;
function joyMove(e){ const r=stick.getBoundingClientRect(); let dx=e.clientX-(r.left+r.width/2), dy=e.clientY-(r.top+r.height/2); const d=Math.hypot(dx,dy), m=42; if(d>m){dx*=m/d;dy*=m/d;}
  joy={x:dx/m,y:dy/m}; knob.style.transform='translate('+dx+'px,'+dy+'px)'; }
stick.addEventListener('pointerdown',e=>{ stick.setPointerCapture(e.pointerId); joyId=e.pointerId; target=null; joyMove(e); e.preventDefault(); });
stick.addEventListener('pointermove',e=>{ if(e.pointerId===joyId) joyMove(e); });
const joyUp=e=>{ if(e.pointerId===joyId){ joyId=null; joy={x:0,y:0}; knob.style.transform=''; } };
stick.addEventListener('pointerup',joyUp); stick.addEventListener('pointercancel',joyUp);
$('run').onclick=()=>{ fast=!fast; $('run').setAttribute('aria-pressed',fast); };
// tap or click a spot to walk there; drag to look
const ray=new THREE.Raycaster(), mark=new THREE.Mesh(new THREE.RingGeometry(.16,.24,40),new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:.9,depthTest:false,side:THREE.DoubleSide}));
mark.rotation.x=-Math.PI/2; mark.visible=false; mark.renderOrder=9; scene.add(mark);
function tapGo(cx,cy){ const r=canvas.getBoundingClientRect(); ray.setFromCamera({x:(cx-r.left)/r.width*2-1,y:-((cy-r.top)/r.height*2-1)},cam);
  const hit=ray.intersectObjects(scene.children,true).find(h=>h.object!==mark&&!(h.object.material&&h.object.material.transparent)); if(!hit) return;
  const hx=hit.point.x, hy=-hit.point.z, hz=hit.point.y; target={x:hx,y:hy}; stuck=0;
  mark.position.set(hx,Math.abs(hz-p.f)<2.6?hz+.03:p.f+.03,-hy); mark.visible=true; }
canvas.addEventListener('pointerdown',e=>{ canvas.setPointerCapture(e.pointerId); ptr.set(e.pointerId,[e.clientX,e.clientY,e.clientX,e.clientY,performance.now()]); });
canvas.addEventListener('pointermove',e=>{ const q=ptr.get(e.pointerId); if(!q) return; const dx=e.clientX-q[0], dy=e.clientY-q[1]; q[0]=e.clientX; q[1]=e.clientY;
  const k=THREE.MathUtils.degToRad(cam.fov)/canvas.clientHeight*1.15; p.yaw-=dx*k; p.pitch=Math.max(-1.3,Math.min(1.3,p.pitch+dy*k)); });
const up=e=>{ const q=ptr.get(e.pointerId); ptr.delete(e.pointerId);
  if(q&&e.type==='pointerup'&&Math.hypot(e.clientX-q[2],e.clientY-q[3])<9&&performance.now()-q[4]<350) tapGo(e.clientX,e.clientY); };
canvas.addEventListener('pointerup',up); canvas.addEventListener('pointercancel',up);

const spots={street:[3.6,-6.2,0,0,.07],entrance:[0.68,2.0,0,0,0],living:[1.3,6.5,0,.95,.05],kitchen:[1.25,13.0,0,0,0],bed1:[3.05,15.5,0,.75,0],bath1:[4.25,12.35,0,.3,0],
  upper:[2.6,10.5,F2,2.55,0],bed2:[0.75,15.5,F2,.95,0],reception:[2.95,1.85,F2,.8,0]};
document.querySelectorAll('[data-j]').forEach(b=>b.onclick=()=>{ const s=spots[b.dataset.j]; p.x=s[0];p.y=s[1];p.f=s[2];p.yaw=s[3];p.pitch=s[4]; target=null; mark.visible=false; });
const coarse=matchMedia('(pointer:coarse)').matches;
$('hint').textContent=coarse?'Tap where you want to go · drag to look · or use the WALK stick':'Click where you want to go · drag to look · or use W A S D / arrow keys';
$('introList').innerHTML=(coarse?['<b>Tap</b> any spot on the floor to walk there.','<b>Drag</b> the picture to look around.','Or hold the round <b>WALK</b> stick to walk yourself.','Tap <b>FAST</b> to move quicker.','The buttons at the bottom jump to a room.']:['<b>Click</b> any spot on the floor to walk there.','<b>Drag</b> to look around.','Or walk with <b>W A S D</b> or the arrow keys. Shift goes faster.','The buttons at the bottom jump to a room.']).map(t=>'<li>'+t+'</li>').join('');
$('introOk').onclick=()=>{ $('intro').hidden=true; };

// ---------- room names ----------
const Z1=[[2.5,5.8,1.15,5.45,'Carport'],[.2,1.35,1.15,5.45,'Entrance passage'],[1.35,2.4,1.15,5.45,'Guest stair'],[-9,15,-99,-0.1,'Street'],[0,6,-0.1,1.15,'Front yard'],
 [.2,5.8,5.45,9.25,'Living room'],[3.3,5.8,9.25,11.75,'Main stair'],[.2,3.3,9.25,11.85,'Dining'],[3.87,5.8,11.85,14.75,'Bathroom'],
 [.2,3.87,11.85,14.85,'Kitchen hall'],[.2,2.4,14.85,19.8,'Kitchen'],[2.4,5.8,14.85,18.75,'Bedroom']];
const Z2=[[0,2.5,-1,1.25,'Balcony'],[2.4,5.8,1.25,5.55,'Reception room'],[.2,1.35,1.25,5.65,'Guest landing'],[1.35,2.4,1.15,5.45,'Guest stair'],
 [3.3,5.8,9.25,11.75,'Main stair'],[.2,3.3,9.15,11.85,'Upper landing'],[3.87,5.8,11.85,14.75,'Bathroom'],[.2,5.8,11.85,14.85,'Upper hall'],[.2,5.8,14.85,19.8,'Upper bedroom']];
function roomName(){ const z=(p.f>1.6?Z2:Z1).find(z=>p.x>=z[0]&&p.x<=z[1]&&p.y>=z[2]&&p.y<=z[3]); return z?z[4]:'—'; }

// ---------- plan key ----------
const mk=$('map').getContext('2d'); let mapT=0, lastRoom='';
function drawMap(){ const cs=getComputedStyle(document.documentElement), s=26, ox=6, oy=12; const upL=p.f>1.6, zb=upL?FH:0;
  const X=x=>ox+x*s, Y=y=>oy+(20.6-y)*s; mk.clearRect(0,0,168,560);
  mk.save(); mk.beginPath(); mk.rect(X(0),Y(20),6*s,20.6*s); mk.clip();
  for(const pass of [1,0]){ mk.fillStyle=cs.getPropertyValue(pass?'--furn':'--wallfill');
    for(const c of cols){ if(c.f!=pass||c.z0>zb+1.5||c.z1<zb+(pass?.3:1.05)||c.x0<0||c.x1>6) continue;
      mk.fillRect(X(c.x0),Y(c.y1),Math.max(1.5,(c.x1-c.x0)*s),Math.max(1.5,(c.y1-c.y0)*s)); } }
  mk.restore();
  mk.fillStyle=cs.getPropertyValue('--accent'); const px=X(Math.max(-.1,Math.min(6.1,p.x))), py=Y(Math.max(-.4,p.y));
  mk.beginPath(); mk.moveTo(px+Math.sin(p.yaw)*14,py-Math.cos(p.yaw)*14);
  mk.lineTo(px+Math.sin(p.yaw+2.4)*8,py-Math.cos(p.yaw+2.4)*8); mk.lineTo(px+Math.sin(p.yaw-2.4)*8,py-Math.cos(p.yaw-2.4)*8); mk.fill();
  $('keyLbl').textContent=upL?'Level 2':'Level 1'; }

// ---------- loop ----------
function resize(){ const w=canvas.clientWidth,h=canvas.clientHeight; renderer.setSize(w,h,false); cam.aspect=w/h; cam.fov=w<h?84:72; cam.updateProjectionMatrix(); }
addEventListener('resize',resize); resize();
let last=performance.now();
function frame(now){ const dt=Math.max(0,Math.min(.05,(now-last)/1000)); last=now;
  p.yaw+=((keys.ArrowRight?1:0)-(keys.ArrowLeft?1:0))*1.9*dt;
  let fw=(keys.KeyW||keys.ArrowUp?1:0)-(keys.KeyS||keys.ArrowDown?1:0)-joy.y, sd=(keys.KeyD?1:0)-(keys.KeyA?1:0)+joy.x;
  const mag=Math.hypot(fw,sd); if(mag>1){fw/=mag;sd/=mag;}
  const sp=(fast||keys.ShiftLeft||keys.ShiftRight?3.6:1.9)*dt; let dx=0, dy=0;
  if(mag>.02){ target=null; mark.visible=false; const sx=Math.sin(p.yaw), cy=Math.cos(p.yaw); dx=(sx*fw+cy*sd)*sp; dy=(cy*fw-sx*sd)*sp; }
  else if(target){ const tx=target.x-p.x, ty=target.y-p.y, d=Math.hypot(tx,ty); if(d<.18){ target=null; mark.visible=false; } else { const st=Math.min(d,sp*1.15); dx=tx/d*st; dy=ty/d*st; } }
  if(dx||dy){ const ox=p.x, oy=p.y, n=Math.max(1,Math.ceil(Math.hypot(dx,dy)/.06));
    for(let i=0;i<n;i++){ const nx=p.x+dx/n; if(!blocked(nx,p.y,p.f)) p.x=nx; const ny=p.y+dy/n; if(!blocked(p.x,ny,p.f)) p.y=ny;
      const c=collide(p.x,p.y,p.f); if(!blocked(c[0],c[1],p.f)){ p.x=c[0]; p.y=c[1]; } }
    p.x=Math.max(-7.5,Math.min(13.5,p.x)); p.y=Math.max(-12,Math.min(19.75,p.y));
    if(target){ if(Math.hypot(p.x-ox,p.y-oy)<Math.hypot(dx,dy)*.25) stuck+=dt; else stuck=0; if(stuck>.5){ target=null; mark.visible=false; } } }
  const h=floorAt(p.x,p.y,p.f); if(h>p.f) p.f+=(h-p.f)*Math.min(1,dt*16); else p.f=Math.max(h,p.f-6*dt);
  cam.position.set(p.x,p.f+EYE,-p.y); const cp=Math.cos(p.pitch);
  cam.lookAt(p.x+Math.sin(p.yaw)*cp,p.f+EYE+Math.sin(p.pitch),-p.y-Math.cos(p.yaw)*cp);
  if(!window.__norender) renderer.render(scene,cam);
  if(now-mapT>100){ mapT=now; drawMap(); const r=roomName()+(p.f>1.6?'2':'1');
    if(r!=lastRoom){ lastRoom=r; $('where').textContent=roomName(); $('lvl').textContent='Level '+(p.f>1.6?2:1); } }
  requestAnimationFrame(frame);
}
window.__walk={p,frame,tapGo,get cols(){return cols},get target(){return target}};

// ---------- load everything ----------
const gl=new THREE.GLTFLoader();
const getJ=u=>fetch(u).then(r=>{ if(!r.ok) throw new Error(u); return r.json(); });
const getEnv=new Promise(res=>new THREE.TextureLoader().load('env.jpg',t=>{ t.mapping=THREE.EquirectangularReflectionMapping; t.encoding=THREE.sRGBEncoding; res(t); },undefined,()=>res(null)));
Promise.all([getJ('manifest.json'),getJ('colliders.json'),getEnv]).then(([man,cd,e])=>{ env=e; addCols(cd);
  const total=man.files.reduce((a,f)=>a+f.bytes,0), got={};
  const show=()=>{ const s=Object.values(got).reduce((a,b)=>a+b,0); $('bar').firstElementChild.style.width=Math.min(100,s/total*100)+'%'; };
  const one=f=>new Promise((res,rej)=>gl.load((window.__flat?'':(LITE?'m/':''))+f.file,g=>{ got[f.file]=f.bytes; show();
      g.scene.traverse(o=>{ if(o.isMesh){ o.material=Array.isArray(o.material)?o.material.map(conv):conv(o.material); o.matrixAutoUpdate=false; o.updateMatrix(); } });
      scene.add(g.scene); res(); },x=>{ got[f.file]=Math.min(f.bytes,x.loaded); show(); },rej));
  if(!LITE) return Promise.all(man.files.map(one));
  return man.files.reduce((q,f)=>q.then(()=>one(f)),Promise.resolve());   // phones: one piece at a time to keep memory low
}).then(()=>{ $('load').hidden=true; $('intro').hidden=false; requestAnimationFrame(frame); })
 .catch(()=>fail('The house could not be loaded. Check your connection and reload the page.'));
})();
</script>
